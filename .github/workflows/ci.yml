name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-core:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Run core unit tests
        run: swift test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-artifacts
          path: .build/
