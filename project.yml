name: Glance
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1

targets:
  GlanceCore:
    type: framework
    platform: macOS
    sources:
      - Sources/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.glance.core

  Glance:
    type: application
    platform: macOS
    sources:
      - Sources/HostApp
    dependencies:
      - target: GlanceCore
      - target: GlanceWidget
        embed: true
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.glance
        INFOPLIST_KEY_LSUIElement: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        APP_GROUP_ID: group.com.example.glance
        CODE_SIGN_ENTITLEMENTS: Sources/HostApp/Glance.entitlements
    info:
      path: Sources/HostApp/Info.plist
      properties:
        LSMinimumSystemVersion: "14.0"

  GlanceWidget:
    type: app-extension
    platform: macOS
    sources:
      - Sources/Widget
    dependencies:
      - target: GlanceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.glance.widget
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CODE_SIGN_ENTITLEMENTS: Sources/Widget/GlanceWidget.entitlements
    info:
      path: Sources/Widget/Info.plist
      properties:
        LSMinimumSystemVersion: "14.0"

  GlanceTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/CoreTests
    dependencies:
      - target: GlanceCore

schemes:
  Glance:
    build:
      targets:
        Glance: all
    test:
      targets:
        - GlanceTests
